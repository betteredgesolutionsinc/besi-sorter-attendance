html{scroll-padding-top:env(safe-area-inset-top,0px)}

.br{display:flex;gap:11px;align-items:center;font-weight:700;white-space:nowrap}
.mk{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center}
.lk{display:flex;gap:4px;flex:1}
.lk a{padding:7px 16px;border-radius:99px;color:var(--mute);font-weight:600;text-decoration:none;border:1px solid transparent}
.lk a:hover{color:var(--ink)}

.pill{display:inline-flex;gap:8px;align-items:center;padding:5px 13px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600;background:var(--panel)}

main{max-width:1200px;margin:0 auto;padding:26px 28px 56px}

.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px;font-variant-numeric:tabular-nums}
th{background:var(--head);text-align:left;padding:0;font-size:12.5px}
th button{font:inherit;font-weight:600;color:var(--mute);background:none;border:0;width:100%;text-align:left;padding:11px 24px;cursor:pointer}

td{padding:11px 24px;border-top:1px solid var(--line)}

.mono{font-feature-settings:"tnum"}.mute{color:var(--mute)}
.tg{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--gbg);color:var(--g)}.mi{background:var(--wbg);color:var(--w)}

    '<div class="card pad"><h2>Needs attention</h2><p class="sub">Employees without an OCW number</p><ul class="lst">'+miss.slice(0,7).map(function(e){return '<li><span class="who"><span class="av">'+ini(e.n)+'</span><b>'+esc(e.n)+'</b></span><span class="tg mi">Missing</span></li>'}).join("")+'</ul><p style="margin:14px 0 0"><a class="link" href="#/employees?f=missing">View all '+miss.length+' →</a></p></div></section>';
  }
  var A={},RG=14,db=null,canW=true;
  function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
  function lab(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en",{month:"short",day:"numeric"})}
  function gv(id){return document.getElementById(id)}
  function attHtml(){return '<section class="card pad" style="margin-bottom:16px"><div class="top" style="margin-bottom:0"><div><h2>Daily attendance</h2><p class="sub" style="margin:0">Updated once all shift logs for the day are in.</p></div><div class="chips" id="rng"><button data-n="14">14 days</button><button data-n="30">30 days</button></div></div><div id="kp"></div><div id="att"></div><div class="leg"><span><i style="background:var(--acc)"></i>On time</span><span><i style="background:var(--amb)"></i>Late</span><span><i style="background:var(--b)"></i>Absent</span></div><div id="logf"></div></section>'}
  function drawAtt(){
    var el=gv("att"),kp=gv("kp");if(!el)return;
    var days=[],t=new Date(),i;
    for(i=RG-1;i>=0;i--)days.push(iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-i)));
    var keys=Object.keys(A).sort();
    if(!keys.length){kp.innerHTML="";el.innerHTML='<div class="empty">No attendance logged yet. Enter a day’s totals below and this chart will build up each day.</div>';return}
    var inR=days.filter(function(d){return A[d]}),rs=inR.map(function(d){var a=A[d],s=a.onTime+a.late+a.absent;return s?(a.onTime+a.late)/s:0});
    var avg=rs.length?Math.round(rs.reduce(function(x,y){return x+y},0)/rs.length*100):0;
    var k=keys[keys.length-1],a=A[k],tot=a.onTime+a.late+a.absent,rate=tot?Math.round((a.onTime+a.late)/tot*100):0;
    kp.innerHTML='<div class="kp"><div><small>Latest log · '+lab(k)+'</small><b>'+rate+'%</b><small>attendance</small></div><div><small>On time</small><b>'+a.onTime+'</b></div><div><small>Late</small><b>'+a.late+'</b></div><div><small>Absent</small><b>'+a.absent+'</b></div><div><small>'+RG+'-day average</small><b>'+avg+'%</b></div></div>';
    var W=720,H=250,L=34,RR=6,T=10,B=26,max=D.length||1;
    inR.forEach(function(d){var a=A[d];max=Math.max(max,a.onTime+a.late+a.absent)});
    var ph=H-T-B,sl=(W-L-RR)/days.length,bw=Math.min(36,sl*.62),s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily attendance: stacked bars of on time, late and absent employees">';
    [0,.25,.5,.75,1].forEach(function(v){var y=T+ph-ph*v;s+='<line x1="'+L+'" x2="'+(W-RR)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*v)+'</text>'});
    days.forEach(function(d,i){
      var x0=L+i*sl,x=x0+(sl-bw)/2,a=A[d],g='<g data-d="'+d+'" style="cursor:pointer">',y=T+ph;
      if(a){var sm=a.onTime+a.late+a.absent;g+='<title>'+lab(d)+': '+a.onTime+' on time, '+a.late+' late, '+a.absent+' absent'+(sm?' ('+Math.round((a.onTime+a.late)/sm*100)+'% attendance)':'')+'. Click to edit.</title>';
        [[a.onTime,"var(--acc)"],[a.late,"var(--amb)"],[a.absent,"var(--b)"]].forEach(function(p){var h=p[0]/max*ph;if(h>0){y-=h;g+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" style="fill:'+p[1]+'"/>'}})}
      else g+='<title>'+lab(d)+': no log yet</title><rect x="'+x+'" y="'+(T+ph-2)+'" width="'+bw+'" height="2" rx="1" style="fill:var(--line)"/>';
      s+=g+'<rect x="'+x0+'" y="'+T+'" width="'+sl+'" height="'+(ph+B)+'" fill="transparent"/></g>';
      if(i%(RG>14?3:1)===0)s+='<text x="'+(x0+sl/2)+'" y="'+(H-8)+'" text-anchor="middle">'+lab(d)+'</text>';
    });
    el.innerHTML=s+'</svg>';
    el.onclick=function(e){var g=e.target.closest&&e.target.closest("[data-d]");if(g)pickDay(g.getAttribute("data-d"))};
  }
  function nv(id){return Math.max(0,Math.floor(+gv(id).value||0))}
  function hint(m){var h=gv("lf-h");if(!h)return;if(m){h.textContent=m;return}var sm=nv("lf-o")+nv("lf-l")+nv("lf-a"),left=D.length-sm;h.textContent="Roster: "+D.length+" · accounted for "+sm+(left<0?" · exceeds roster size":" · "+left+" unaccounted")}
  function fillLog(){var a=A[gv("lf-d").value];gv("lf-o").value=a?a.onTime:0;gv("lf-l").value=a?a.late:0;gv("lf-a").value=a?a.absent:0;hint(a?"Editing the saved log for "+lab(gv("lf-d").value):"")}
  function renderLog(){
    var h=gv("logf");if(!h)return;
    if(!db){h.innerHTML='<p class="sub" style="margin:16px 0 0">Attendance logging is available when this page is opened signed in to Claude.</p>';return}
    if(!canW){h.innerHTML='<p class="sub" style="margin:16px 0 0">You have view-only access. Ask the page owner for edit access to log attendance.</p>';return}
    var td=iso(new Date());
    h.innerHTML='<div class="logf"><label>Date<input type="date" id="lf-d" max="'+td+'" value="'+td+'"></label><label>On time<input type="number" min="0" id="lf-o" value="0"></label><label>Late<input type="number" min="0" id="lf-l" value="0"></label><label>Absent<input type="number" min="0" id="lf-a" value="0"></label><button class="btn" id="lf-s">Save day’s log</button><span class="hint" id="lf-h"></span></div>';
    gv("lf-d").onchange=fillLog;["lf-o","lf-l","lf-a"].forEach(function(id){gv(id).oninput=function(){hint()}});
    gv("lf-s").onclick=function(){
      var d=gv("lf-d").value,o=nv("lf-o"),l=nv("lf-l"),a=nv("lf-a");
      if(!d){hint("Choose a date first.");return}
      if(o+l+a>D.length){hint("Totals exceed the roster of "+D.length+". Please check the numbers.");return}
      gv("lf-s").disabled=true;
      db.doc("attendance/"+d).set({date:d,onTime:o,late:l,absent:a,updatedAt:new Date().toISOString()}).then(function(){hint("Saved the log for "+lab(d)+".");gv("lf-s").disabled=false}).catch(function(){hint("Could not save. Check that you have edit access.");gv("lf-s").disabled=false});
    };
    fillLog();
  }
  function pickDay(day){if(!gv("lf-d"))return;gv("lf-d").value=day;fillLog();gv("logf").scrollIntoView({behavior:"smooth",block:"nearest"})}
  function bindAtt(){
    var b=document.querySelectorAll("#rng button");
    function mark(){b.forEach(function(x){x.setAttribute("aria-pressed",+x.dataset.n===RG)})}
    b.forEach(function(x){x.onclick=function(){RG=+x.dataset.n;mark();drawAtt()}});mark();renderLog();drawAtt();
  }
  function view(){
    var q=S.q.toLowerCase(),l=D.filter(function(e){return (S.f==="all"||(S.f==="has"?e.o:!e.o))&&(e.n.toLowerCase().indexOf(q)>-1||e.o.indexOf(q)>-1||e.e.toLowerCase().indexOf(q)>-1)});
    l.sort(function(a,b){var x=a[S.k],y=b[S.k];if(S.k==="o"){if(!x&&y)return 1;if(x&&!y)return -1}return x.localeCompare(y,undefined,{numeric:true})*S.d});
    return l;
  }
  function paint(){
    var l=view(),pages=Math.max(1,Math.ceil(l.length/PS));if(S.p>=pages)S.p=pages-1;
    var s=S.p*PS,pg=l.slice(s,s+PS);
    document.getElementById("rows").innerHTML=pg.map(function(e){return '<tr><td><span class="who"><span class="av">'+ini(e.n)+'</span><b>'+esc(e.n)+'</b></span></td><td class="mono">'+(e.o||'<span class="mute">—</span>')+'</td><td class="mute">'+esc(e.e)+'</td><td><span class="tg '+(e.o?'ok">Matched':'mi">Missing')+'</span></td></tr>'}).join("");
    document.getElementById("empty").hidden=l.length>0;
    document.getElementById("info").textContent=l.length?"Showing "+(s+1)+"–"+(s+pg.length)+" of "+l.length:"0 results";
    document.getElementById("pn").textContent="Page "+(S.p+1)+" of "+pages;
    document.getElementById("prev").disabled=S.p===0;document.getElementById("next").disabled=S.p>=pages-1;
    document.querySelectorAll("th").forEach(function(t){t.removeAttribute("aria-sort");if(t.dataset.k===S.k)t.setAttribute("aria-sort",S.d>0?"ascending":"descending")});
    document.querySelectorAll(".chips button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.f===S.f)});
  }
  function emp(){
    app.innerHTML=head('<a href="#/">Overview</a> / Employees','Employees','Search, filter and review every employee record.')+
    '<section class="card"><div class="tools"><div class="chips"><button data-f="all">All ('+D.length+')</button><button data-f="has">OCW matched ('+have+')</button><button data-f="missing">OCW missing ('+miss.length+')</button></div><input class="search" type="search" placeholder="Search name, OCW or email" aria-label="Search employees" value="'+esc(S.q)+'"></div>'+
    '<div class="sc"><table><thead><tr><th data-k="n"><button>Employee name</button></th><th data-k="o"><button>OCW number</button></th><th data-k="e"><button>Login email</button></th><th data-k="o"><button>OCW status</button></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden>No employees match your search.</div>'+
    '<div class="pg"><span id="info"></span><div><button id="prev">Previous</button><span id="pn"></span><button id="next">Next</button></div></div></section>';
    document.querySelectorAll(".chips button").forEach(function(b){b.onclick=function(){S.f=b.dataset.f;S.p=0;paint()}});
    document.querySelector(".search").oninput=function(e){S.q=e.target.value.trim();S.p=0;paint()};
    document.querySelectorAll("th").forEach(function(t){t.querySelector("button").onclick=function(){if(S.k===t.dataset.k)S.d*=-1;else{S.k=t.dataset.k;S.d=1}S.p=0;paint()}});
    document.getElementById("prev").onclick=function(){S.p--;paint()};document.getElementById("next").onclick=function(){S.p++;paint()};
    paint();
  }
  function route(){
    var h=(location.hash||"#/").slice(1).split("?"),r=h[0]==="/employees"?"employees":"home";
    links.forEach(function(a){a.dataset.r===r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
    if(r==="employees"){var m=/f=(has|missing)/.exec(h[1]||"");S.f=m?m[1]:"all";S.q="";S.p=0;emp()}else{home();bindAtt()}
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);route();
  (async function(){try{
    if(!window.claude||!window.claude.use)return;
    var u=await claude.use("user"),d=await claude.use("db");if(!d)return;
    db=d;if(u&&u.can){canW=u.can("data.write")!==false}
    renderLog();
    db.collection("attendance").onSnapshot(function(s){A={};s.docs.forEach(function(x){var v=x.data()||{};A[x.id]={onTime:Math.max(0,+v.onTime||0),late:Math.max(0,+v.late||0),absent:Math.max(0,+v.absent||0)}});drawAtt()},function(){});
  }catch(e){}})();
})();
</script>
</body>
